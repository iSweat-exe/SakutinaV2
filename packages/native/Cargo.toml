[package]
name = "sakutina-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
napi = { version = "3.12.4", features = ["napi9"] }
napi-derive = "3.6.5"
tiny-skia = "0.11"

[build-dependencies]
napi-build = "2.3.2"

[profile.release]
lto = "thin"
opt-level = 3
