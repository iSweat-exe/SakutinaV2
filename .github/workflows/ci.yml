name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: packages/native
      - run: cargo test --locked
        working-directory: packages/native

  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Compile l'addon pour que les tests natifs du bot ne soient pas ignorés.
      - run: bun run native:build
      - run: bun run check
      - run: bun run test

  # Construit l'image de production comme Render le fera : un Dockerfile cassé bloque le déploiement.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sakutina:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Un build réussi ne prouve pas que l'image démarre : vérifie que les dépendances du bot sont résolubles.
      - run: docker run --rm -w /app/apps/bot sakutina:ci bun -e "await import('discord.js'); await import('postgres')"

  # Le panneau n'était vérifié que par Vercel au déploiement : on le contrôle avant la fusion.
  panel:
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : le build les exige, aucune n'est contactée.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
        working-directory: apps/panel
      - run: bunx next typegen && bunx tsc --noEmit -p .
        working-directory: apps/panel
      - run: bun run test
        working-directory: apps/panel
      - run: bun run build
        working-directory: apps/panel

  # Outils internes (tools/) et inventaire généré : docs/inventory.md doit refléter le code.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd tools check
      - run: bun run --cwd tools test
      - run: bun run inventory --check
